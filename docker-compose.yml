services:
  app:
    build: .
    ports:
      - "7853:3000"
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgres://chatgreen:chatgreen@postgres:5432/chatgreen
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatgreen
      POSTGRES_PASSWORD: chatgreen
      POSTGRES_DB: chatgreen
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatgreen -d chatgreen"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  crawler:
    image: curlimages/curl:8.11.0
    env_file:
      - .env.local
    depends_on:
      app:
        condition: service_started
    command: >
      sh -c "while true; do
        curl -fsS -X POST http://app:3000/api/cron/refresh
          -H \"Authorization: Bearer $${CRON_SECRET}\" || true;
        sleep 900;
      done"
    restart: unless-stopped

volumes:
  postgres_data:
