services:
  app:
    build: .
    ports:
      - "127.0.0.1:7853:3000"
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgres://chatgreen:chatgreen@postgres:5432/chatgreen
      LIBRARY_DATA_DIR: /data
    volumes:
      - library_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatgreen
      POSTGRES_PASSWORD: chatgreen
      POSTGRES_DB: chatgreen
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatgreen -d chatgreen"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  crawler:
    image: curlimages/curl:8.11.0
    env_file:
      - .env.local
    depends_on:
      app:
        condition: service_started
    command: >
      sh -c "while true; do
        curl -fsS -X POST http://app:3000/api/cron/refresh
          -H \"Authorization: Bearer $${CRON_SECRET}\" || true;
        sleep 900;
      done"
    restart: unless-stopped

  health-monitor:
    image: curlimages/curl:8.11.0
    env_file:
      - .env.local
    depends_on:
      app:
        condition: service_healthy
    command: >
      sh -c "sleep 60; while true; do
        curl -fsS -X POST http://app:3000/api/library/system-health
          -H \"Authorization: Bearer $${CRON_SECRET}\" || true;
        sleep 86400;
      done"
    restart: unless-stopped

volumes:
  postgres_data:
  library_data:
